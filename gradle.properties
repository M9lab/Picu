org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Senza questo flag, ./gradlew assembleDebug da riga di comando (come fa la CI)
# marca il manifest con android:testOnly="true": l'APK risultante si installa
# solo via "adb install", e il Package Installer di Android rifiuta di
# installarlo manualmente (tap sul file scaricato) con "Pacchetto non
# installato", anche alla primissima installazione.
android.injected.testOnly=false
