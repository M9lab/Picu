name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Write local.properties (codice famiglia)
        env:
          PICU_FAMILY_CODE: ${{ secrets.PICU_FAMILY_CODE }}
        run: echo "PICU_FAMILY_CODE=$PICU_FAMILY_CODE" >> local.properties

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: picu-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK on the "latest" release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git tag -f latest
          git push -f origin latest
          gh release delete latest --yes || true
          gh release create latest app/build/outputs/apk/debug/app-debug.apk \
            --title "Picu - ultima build" \
            --notes "Build automatica dal commit ${{ github.sha }}"
